<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAIWAN FIMILY</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background:
        radial-gradient(1200px 600px at 50% -10%, #eaf2fb 0%, transparent 60%),
        #f5f6f8;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 40px 32px 34px;
      text-align: center;
      box-shadow: 0 8px 28px rgba(17, 24, 39, 0.06);
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .08em;
      color: #5B9BD5;
      background: #eaf2fb;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      line-height: 1.75;
      color: #6b7280;
      margin-bottom: 26px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: transform .12s, box-shadow .12s, background .15s;
    }

    .btn-primary {
      background: #5B9BD5;
      color: #fff;
      box-shadow: 0 4px 14px rgba(91, 155, 213, .3);
    }

    .btn-primary:hover {
      background: #4a8ac9;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(91, 155, 213, .38);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">TAIWAN FIMILY · 應援企劃</div>
    <h1>LE SSERAFIM<br>PUREFLOW 台北場應援</h1>
    <p>感謝每一位 FEARNOT 的參與<br>期待你的想法 一起打造最難忘的台北場</p>

    <div class="links">
      <a class="btn btn-primary" href="/survey">填寫應援企劃募集表單</a>
    </div>
  </div>
</body>
</html>
